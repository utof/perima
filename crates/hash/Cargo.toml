[package]
name = "perima-hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # WHY: intra-workspace only; not published to crates.io

# WHY bench = false on lib (added 2026-04-25): `cargo bench -p perima-hash`
# without this flag also runs the lib's libtest harness on src/lib.rs, which
# rejects criterion's `--sample-size` flag with "Unrecognized option". Only
# the [[bench]] target below should receive bench-runner args.
[lib]
bench = false

[dependencies]
perima-core = { path = "../core" }
thiserror.workspace = true
blake3.workspace    = true
rayon.workspace     = true
tracing.workspace   = true

[dev-dependencies]
tempfile.workspace = true
# WHY criterion: slice 4 of T1 test-architecture decomposition adds
# Blake3Service hash-throughput benchmarks (3 sizes × 2 hash modes).
# Observability-only per spec D-4: weekly cron prints results, no
# threshold gate.
criterion = "0.5"

[[bench]]
name = "blake3"
harness = false  # WHY: criterion installs its own harness; libtest off.

[lints]
workspace = true
