[package]
name = "perima-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # WHY: intra-workspace only; not published to crates.io

# WHY bench = false on lib (added 2026-04-25): `cargo bench -p perima-db`
# without this flag also runs the lib's libtest harness on src/lib.rs, which
# rejects criterion's `--sample-size` flag with "Unrecognized option". Only
# the [[bench]] target below should receive bench-runner args.
[lib]
bench = false

[dependencies]
perima-core = { path = "../core" }
rusqlite.workspace  = true
refinery.workspace  = true
thiserror.workspace = true
tracing.workspace   = true
uuid.workspace      = true
chrono.workspace    = true
flume.workspace     = true
minijinja.workspace = true
r2d2.workspace      = true
r2d2_sqlite.workspace = true
# WHY tokio-util in prod deps: TranscriptWriteCmd::Insert carries an
# Option<CancellationToken> threaded from the use-case so the writer
# can roll back mid-transaction if the caller cancels (closes the
# cancel-after-adapter-success window per the transcription v1 spec).
tokio-util.workspace = true

[features]
default = []
# WHY: gates the shared `test_utils` module so production builds don't
# expose NoopBus + future test scaffolding. Crates that need NoopBus in
# their dev-dependencies enable this feature on perima-db.
test-utils = []

[dev-dependencies]
tempfile.workspace  = true
blake3.workspace    = true
proptest.workspace  = true
insta.workspace     = true
# WHY self-dep: integration tests live in `tests/` and consume perima-db
# as an external crate, so they need the `test-utils` feature enabled
# explicitly. Cargo's dev-dependency self-reference is the canonical
# pattern for this (used by serde, tokio, etc.) — it's surprising the
# first time you see it but standard.
perima-db = { path = ".", features = ["test-utils"] }
# WHY criterion: slice 4 of T1 test-architecture decomposition adds
# FTS5 search-latency benchmark on a seeded SQLite DB. Observability-
# only per spec D-4.
criterion = "0.5"
# WHY perima-app + perima-fs + perima-hash in dev-deps: the rescan bench
# (Task 16) builds a ScanUseCase directly, which requires the same
# adapter + service types the CLI/Desktop shells wire at startup. Kept
# in dev-deps (not dependencies) so production builds of perima-db
# never pull in the app orchestration layer.
perima-app   = { workspace = true }
perima-fs    = { path = "../fs" }
perima-hash  = { path = "../hash" }
perima-media = { workspace = true }
# WHY tokio: ScanUseCase::execute is async; the rescan bench drives it
# via `Runtime::block_on` (one runtime per binary — this bench IS the
# binary, so no secondary-runtime violation). `tokio-util` is already a
# prod dep (CancellationToken in TranscriptWriteCmd::Insert) so it is
# automatically visible to integration tests + benches.
tokio.workspace     = true

[[bench]]
name = "fts"
harness = false  # WHY: criterion installs its own harness; libtest off.

[[bench]]
name = "rescan"
harness = false  # WHY: criterion installs its own harness; libtest off.

[lints]
workspace = true
