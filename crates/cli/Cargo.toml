[package]
name = "perima"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # WHY: intra-workspace only; not published to crates.io

[dependencies]
perima-core  = { path = "../core" }
perima-hash  = { path = "../hash" }
perima-fs    = { path = "../fs" }
perima-db    = { path = "../db" }
# WHY `workspace = true` (not path-local): release-plz reads the workspace
# dep graph to decide which crates need version bumps. A `feat(media):`
# commit must propagate to `perima` so the CLI rev matches the media rev
# it links against.
perima-media = { workspace = true }
# WHY workspace = true: release-plz propagates Batch-B app-layer bumps
# into the CLI, same rationale as perima-media above.
perima-app   = { workspace = true }
# WHY perima-transcribe in CLI: build_container needs to construct a
# CliFfmpegInvoker + FfmpegAudioPipeline at startup so the container's
# transcription use-case can run without a Tauri sidecar resolver.
perima-transcribe = { path = "../transcribe" }
chrono.workspace    = true
serde_json.workspace = true
serde.workspace      = true

async-trait.workspace        = true
clap.workspace               = true
miette.workspace             = true
tracing.workspace            = true
directories.workspace        = true
ctrlc.workspace              = true
rayon.workspace              = true
uuid.workspace               = true
tokio.workspace              = true
tokio-util.workspace         = true
# WHY tempfile: MissingFfmpegPipeline (in main.rs) returns NamedTempFile in
# its trait signature. Pulled into runtime deps; was previously dev-only.
tempfile.workspace           = true

[dev-dependencies]
tempfile.workspace   = true
insta.workspace      = true
rusqlite.workspace   = true
serde_json.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
# WHY image + blake3 in dev-deps: `scan_with_metadata_test.rs`
# synthesises PNG/JPEG fixtures at runtime (no binary blobs in git),
# matching the pattern already used in `crates/media/tests`.
image.workspace      = true

[target.'cfg(unix)'.dev-dependencies]
# WHY: nix provides POSIX signal utilities (kill/SIGTERM) without unsafe libc.
# Used in watch integration tests to send SIGTERM to the spawned child.
nix = { version = "0.31", features = ["signal"] }

[lints]
workspace = true
