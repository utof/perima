[package]
name = "perima-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # WHY: intra-workspace only; not published to crates.io

[features]
# WHY specta feature: `ScanReport` needs `specta::Type` when the desktop
# handler returns it across the IPC boundary. Mirrors the pattern in
# `crates/core` (optional dep, cfg_attr gated). Activated by
# `perima-desktop` via `perima-app = { features = ["specta"] }`.
specta = ["dep:specta", "perima-core/specta"]

[dependencies]
perima-core       = { path = "../core" }
perima-fs         = { path = "../fs" }
perima-hash       = { path = "../hash" }
perima-media      = { workspace = true }
# WHY perima-transcribe in app: TranscriptionUseCase composes the transcriber
# registry + audio pipeline at AppContainer build time. The use-case lives in
# crates/app (alongside the other UseCases); the adapter crate stays the
# pure transcription-port impl. No reverse dep — perima-transcribe does NOT
# depend on perima-app.
perima-transcribe = { path = "../transcribe" }
# WHY perima-db in (non-test) deps: TranscriptionUseCase calls
# `SqliteTranscriptRepository::insert_with_request_uuid` directly because the
# transcript repo is intentionally NOT a port (sole consumer is the use-case;
# adding a port trait would be premature abstraction per the spec's
# "transcript_repo intentionally adapter-only" note).
perima-db         = { path = "../db" }
async-broadcast = { workspace = true }
async-trait     = { workspace = true }
directories.workspace        = true
futures         = { workspace = true }
# WHY flume: TranscriptionUseCase owns a flume::bounded(32) job queue; the
# producer side hands `QueueItem` to the worker task spawned at construction.
flume.workspace      = true
# WHY keyring: AppContainer wiring resolves per-provider API keys from the
# OS keyring before instantiating each transcriber. Skipping a provider
# whose key is missing is the correct first-run posture — a Tauri-side
# settings command (T7) writes the key, then the user re-opens.
keyring.workspace    = true
tokio.workspace    = true
tokio-util.workspace = true
thiserror.workspace = true
# WHY toml: transcription provider config is a TOML file. NOT a workspace-
# wide dep — only crates/app reads the user's `config.toml`.
toml.workspace       = true
tracing.workspace        = true
tracing-appender.workspace   = true
tracing-subscriber.workspace = true
# WHY serde: ScanReport + ScanReportEntry derive Serialize so the
# desktop handler can return the UseCase output directly across the
# IPC boundary (Batch D Task 8 — no shell-side ScanResult mirror).
serde.workspace = true
# WHY rayon: ScanUseCase parallelizes BLAKE3 hashing across CPUs via
# `par_iter`. Matches the pattern in `crates/cli/src/cmd/scan.rs`
# pre-extraction; Batch B preserves the exact orchestration shape.
rayon.workspace    = true
# WHY uuid: VolumeId fallback in dry-run path uses `Uuid::nil()`.
uuid.workspace     = true
# WHY chrono: BackupDatabaseUseCase formats default-target ISO 8601 UTC
# timestamps in the backup filename (`perima-<UTC>.sqlite`). chrono is
# already a transitive workspace dep; pulling it in as a direct dep
# documents the intent at the use-case layer.
chrono.workspace   = true
# WHY optional specta: see [features] above. Not a hard dep — normal
# `cargo build` of `perima-app` (CLI, tests) does not pull in specta.
specta = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
insta.workspace    = true
# WHY perima-db + rusqlite in dev-deps: integration-flavored unit tests
# construct real SQLite-backed adapters (matching crates/db::file_repo
# tests) rather than invent new mock ports. DB is NOT a runtime dep of
# crates/app — shells inject `Arc<dyn Port>` adapters.
perima-db = { path = "../db" }
rusqlite.workspace = true

[lints]
workspace = true
