[package]
name = "perima-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # WHY: intra-workspace only; not published to crates.io

[dependencies]
thiserror.workspace = true
serde.workspace     = true
uuid.workspace      = true
tokio-util.workspace = true
unicode-normalization.workspace = true
# WHY features = ["derive", "uuid"]: specta::Type proc-macro lives behind
# the "derive" feature. The "uuid" feature adds specta::Type impl for
# uuid::Uuid so VolumeId/DeviceId(uuid::Uuid) can use #[specta(transparent)].
specta = { workspace = true, optional = true, features = ["derive", "uuid"] }

[features]
default = []
specta = ["dep:specta"]

[dev-dependencies]
proptest.workspace  = true
blake3.workspace    = true
tempfile.workspace  = true
serde_json.workspace = true

[lints]
workspace = true
