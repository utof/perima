# Lefthook config for perima — managed by lefthook; do not hand-roll
# scripts/pre-commit again.
#
# Thin pre-commit (<10s) fires on every commit: fmt-check + typos +
# ts-lint (glob-filtered so only relevant staged extensions trigger each
# command). Thick pre-push (<90s) fires on push and mirrors CI.
#
# Escape hatches:
#   LEFTHOOK=0 git commit ...          — skip all hooks
#   LEFTHOOK=0 git push ...            — skip all hooks on push
#   LEFTHOOK_EXCLUDE=name git commit   — skip a specific command
#
# WHY inline PATH export: git hooks run in non-interactive shells that
# don't source ~/.bashrc; cargo-installed binaries aren't on PATH.
# Env vars are prepended inline rather than via `rc` because POSIX sh
# (dash) rejects `. relative-path` without a leading `./`, and lefthook
# generates `[ -f .lefthook-rc.sh ] && . .lefthook-rc.sh` which fails
# on dash. Per-command env is reliable across all POSIX shells.
#
# WHY PKG_CONFIG_PATH + LIBRARY_PATH per Rust command: Tauri toolchain
# (webkit2gtk/libsoup) lives under /tmp/tauri-libs on this dev VM.
# Without these paths, cargo build steps for perima-desktop fail to
# locate system libraries during clippy / test / doc.

min_version: "2.1.0"

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      # WHY glob: only runs when .rs or Cargo.toml files are staged —
      # cargo fmt formats both; avoids a useless invocation on comment-
      # only or docs-only commits.
      glob: "*.{rs,toml}"
      run: export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && cargo fmt --all -- --check
    typos:
      # WHY no glob: typos scans all text; it's fast enough to always run.
      run: export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && typos
    ts-lint:
      # WHY glob: only runs when TS/JS files are staged in apps/desktop.
      root: apps/desktop
      glob: "*.{ts,tsx,js,jsx}"
      run: bun run lint
    exec-bits:
      # WHY glob: a 100644 shell script can only enter the index via a
      # commit that stages a shell script, so gating on that extension
      # catches every introduction path at zero cost on other commits.
      # Globs are calculated from the repo root, so this covers scripts
      # anywhere — scripts/, .github/, or elsewhere.
      #
      # WHY the script then checks the whole index rather than just the
      # staged paths: it is the same single `git ls-files` either way, and
      # the wider check also catches drift that predates this hook.
      #
      # WHY this needs a hook at all — the failure is invisible locally:
      # clones with `core.fileMode = false` ignore the on-disk permission
      # bit, so the script looks executable, `ls -l` agrees, and it still
      # lands as 100644. It only surfaces as "permission denied" on a CI
      # runner. See scripts/check-exec-bits.sh.
      #
      # WHY `sh scripts/...` and not `./scripts/...` like no-cargo-test:
      # this is the one script whose own exec bit must not gate it, or a
      # missing bit on the checker yields the same bare "permission
      # denied" it exists to explain. It still checks itself.
      glob: "*.{sh,bash}"
      run: sh scripts/check-exec-bits.sh

pre-push:
  # WHY parallel:false — steps share the incremental compile cache;
  # serial ordering is predictable and avoids races on target/.
  parallel: false
  commands:
    clippy:
      env:
        PKG_CONFIG_PATH: /tmp/tauri-pc
        LIBRARY_PATH: /tmp/tauri-libs:/usr/lib/x86_64-linux-gnu
      run: export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && cargo clippy --workspace --all-targets -- -D warnings
    cargo-test:
      env:
        PKG_CONFIG_PATH: /tmp/tauri-pc
        LIBRARY_PATH: /tmp/tauri-libs:/usr/lib/x86_64-linux-gnu
      # WHY nextest not `cargo test`: SQLite has a lock-order inversion in
      # unixClose vs unixLock-from-WAL-close that deadlocks when multiple
      # Connection handles to the same DB are dropped concurrently. cargo
      # nextest's process-per-test isolation eliminates the race; the
      # repo-level `no-cargo-test` check (below + just recipe) prevents
      # regression. Doctest invocation below stays as `cargo test --doc`
      # (nextest doesn't run doctests).
      run: export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && cargo nextest run --workspace --all-targets
    no-cargo-test:
      # Enforce the "no cargo test" rule across committed automation. Catches
      # accidental reintroduction at push time. See scripts/no-cargo-test.sh.
      run: ./scripts/no-cargo-test.sh
    cargo-doctest:
      env:
        PKG_CONFIG_PATH: /tmp/tauri-pc
        LIBRARY_PATH: /tmp/tauri-libs:/usr/lib/x86_64-linux-gnu
      run: export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && cargo test --workspace --doc
    docs-coverage:
      env:
        PKG_CONFIG_PATH: /tmp/tauri-pc
        LIBRARY_PATH: /tmp/tauri-libs:/usr/lib/x86_64-linux-gnu
      run: export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && cargo doc --workspace --no-deps
    cargo-deny:
      run: export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && cargo deny check
    frontend-build:
      root: apps/desktop
      run: bun install --frozen-lockfile && bun run build
    frontend-test:
      root: apps/desktop
      run: bun run test
